name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Lint, test and build (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Unit and integration tests
        run: make test

      - name: Generate synthetic data and run the pipeline with Dagster
        run: make demo

      - name: Build the API image and upload a synthetic export to it
        run: |
          docker build -t liftpipe-api .
          docker run -d --name liftpipe-api -p 8000:8000 liftpipe-api
          for i in $(seq 1 90); do curl -sf localhost:8000/healthz >/dev/null && break; sleep 1; done
          CSV=$(ls data/synthetic/hevy/*.csv | tail -1)
          curl -sf --max-time 120 -F "file=@$CSV" -o dashboard.zip localhost:8000/v1/dashboards
          unzip -l dashboard.zip
          unzip -l dashboard.zip | grep -q meta.json

      - name: API container logs
        if: failure()
        run: docker logs liftpipe-api || true

      - name: Generate dbt docs
        run: uv run dbt docs generate --project-dir dbt/liftpipe --profiles-dir dbt/liftpipe
        env:
          LIFTPIPE_WAREHOUSE: ${{ github.workspace }}/data/warehouse/liftpipe_synthetic.duckdb

      - name: Upload marts and dbt docs
        uses: actions/upload-artifact@v5
        with:
          name: liftpipe-build
          path: |
            dashboard/public/data/
            dbt/liftpipe/target/index.html
            dbt/liftpipe/target/manifest.json
            dbt/liftpipe/target/catalog.json
          retention-days: 14

  dashboard:
    name: Typecheck and build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
