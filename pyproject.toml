[project]
name = "liftpipe"
version = "0.1.0"
description = "Fitness data pipeline: Hevy and Apple Health exports to DuckDB marts via Dagster and dbt."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sam Sahbaei Razavi", email = "h24sasah@du.se" }]
dependencies = [
    "duckdb>=1.5.6",
    "faker>=40.43.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liftpipe"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
