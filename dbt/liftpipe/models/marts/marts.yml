version: 2

models:
  - name: dim_exercise
    description: One row per exercise performed, with muscle groups from the seed.
    columns:
      - name: exercise_id
        data_tests: [unique, not_null]
      - name: exercise_title
        data_tests: [unique, not_null]
      - name: primary_muscle_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [chest, back, shoulders, biceps, triceps, quadriceps, hamstrings, glutes, calves, core, cardio, other]

  - name: fct_sets
    description: Incremental fact table at set grain.
    columns:
      - name: set_id
        description: Natural key; hash of workout, exercise position and set index.
        data_tests: [unique, not_null]
      - name: workout_id
        description: Hash of the workout start time.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_workouts')
                field: workout_id
      - name: exercise_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_exercise')
                field: exercise_id
      - name: set_type
        data_tests:
          - accepted_values:
              arguments:
                values: [normal, warmup, failure, dropset]
      - name: reps
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: weight_kg
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 500
      - name: volume_kg
        description: Weight times reps for working sets; null for warm-ups and unloaded sets.
      - name: estimated_1rm_kg
        description: Epley e1RM for working sets of 1-12 reps with a load.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 700

  - name: fct_workouts
    description: One row per session across Hevy and Apple Health, de-duplicated.
    columns:
      - name: workout_id
        data_tests: [unique, not_null]
      - name: source
        description: hevy, or apple_health for watch workouts with no matching Hevy session.
        data_tests:
          - accepted_values:
              arguments:
                values: [hevy, apple_health]
      - name: workout_type
        data_tests:
          - accepted_values:
              arguments:
                values: [strength, cardio]
      - name: energy_kcal
        description: Active energy from the Apple Watch workout recorded alongside the session.
      - name: has_watch_data
        description: True when an Apple Health workout was matched (start within 30 minutes).
      - name: duration_min
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 600

  - name: mart_weekly_muscle_volume
    description: Weekly working sets, fractional sets and volume per muscle group.
    data_tests:
      - unique_combination:
          arguments:
            columns: [week_start, muscle_group]
    columns:
      - name: working_sets
        description: Non-warm-up sets where this is the exercise's primary muscle.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: fractional_sets
        description: Working sets plus half a set for each set where this is the secondary muscle.
      - name: volume_kg
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

  - name: mart_exercise_e1rm
    description: Daily best e1RM per exercise with a 28-day rolling best and trend.
    data_tests:
      - unique_combination:
          arguments:
            columns: [exercise_id, workout_date]
    columns:
      - name: best_e1rm_kg
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 700
      - name: rolling_28d_best_e1rm_kg
        description: Best e1RM in the 28 days up to and including this session.
      - name: pct_change_28d
        description: Change of the rolling best against the rolling best 28 days earlier.
      - name: overload_trend
        description: progressing at +2.5 % or more, regressing at -2.5 % or less, else plateau.
        data_tests:
          - accepted_values:
              arguments:
                values: [progressing, plateau, regressing, insufficient_history]

  - name: mart_pr_history
    description: Personal records per exercise and record type.
    columns:
      - name: pr_id
        data_tests: [unique, not_null]
      - name: pr_type
        data_tests:
          - accepted_values:
              arguments:
                values: [e1rm, heaviest_weight, most_reps]
      - name: is_first_record
        description: The first time the exercise was logged; a baseline rather than a beaten record.
      - name: improvement
        description: Gain over the previous best, in kg or reps.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 500

  - name: mart_body_trends
    description: Daily body metrics with 7-day rolling averages on a continuous calendar.
    data_tests:
      - unique_combination:
          arguments:
            columns: [metric, measured_on]
    columns:
      - name: metric
        data_tests:
          - accepted_values:
              arguments:
                values: [body_mass_kg, body_fat_pct, lean_body_mass_kg, resting_hr_bpm]
      - name: value
        description: Null on days without a reading.
      - name: rolling_avg_change_28d
        description: Change in the 7-day average over the past 28 days.
      - name: rolling_7d_avg
        description: Mean of the readings in the trailing seven calendar days.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 250

  - name: mart_training_consistency
    description: Weekly session counts, active days, streaks and rolling frequency.
    columns:
      - name: week_start
        data_tests: [unique, not_null]
      - name: streak_weeks
        description: Consecutive weeks up to this one with at least one strength session.
      - name: active_days
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 7
